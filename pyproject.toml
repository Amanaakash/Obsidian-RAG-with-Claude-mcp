[project]
name = "obsidian-rag-assistant"
version = "0.2.0"
description = "A local-first RAG assistant for semantic search over Obsidian Markdown notes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Aman Aakash" },
]
keywords = ["obsidian", "rag", "mcp", "ollama", "chromadb", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=1.0,<2.0",
    "filelock>=3.16,<5.0",
    "mcp>=2.0,<3.0",
    "ollama>=0.5,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
obsidian-rag = "obsidian_rag.cli:main"
obsidian-rag-mcp = "obsidian_rag.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Amanaakash/Obsidian-RAG-with-Claude-mcp"
Repository = "https://github.com/Amanaakash/Obsidian-RAG-with-Claude-mcp"
Issues = "https://github.com/Amanaakash/Obsidian-RAG-with-Claude-mcp/issues"
Changelog = "https://github.com/Amanaakash/Obsidian-RAG-with-Claude-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
