name: Bug report
description: Report a reproducible problem using synthetic or sample-vault data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Never attach private notes, credentials, or generated vector data.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproduction using sample or synthetic Markdown.
      placeholder: |
        1. Run ...
        2. Index ...
        3. Search ...
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11, Ubuntu 24.04, macOS, etc.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Python, uv, Ollama, and project version where relevant.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove private paths, note text, credentials, and secrets before pasting output.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private notes, absolute personal paths, credentials, and generated vector data.
          required: true
